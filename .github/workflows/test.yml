# One entry point on two systems, because an arm nobody runs is an arm
# nobody has checked - the Makefile says so about the two signal arms and
# it is true of the platforms as well.
#
# What each system proves, and nothing is claimed beyond it:
#
#   ubuntu  the io_uring forwarder and the engine behind it. On a host
#           with io_uring the engine is never entered - the syscall
#           layer goes straight to __NR_io_uring_* - so this also runs
#           the engine arms through test/backends, which asks for each
#           backend by name.
#   macos   the dispatch signal arm, and nothing else that no other
#           runner covers. dispatch/dispatch.h is on this system and no
#           other, so this job is the only compiler that arm ever sees.
#           It does NOT certify kqueue. That implementation is not
#           steady enough to stand as a reference, which is why the
#           EVFILT_VNODE arm runs on Linux through libkqueue with
#           inotify as the oracle - see test/inotify_kqueue.sh. A green
#           run here says the tree builds and behaves on Apple clang;
#           it does not say kqueue is right.
#   windows the Windows arms on the real thing, with MSVC. Wine gives
#           the ubuntu job a good imitation of IOCP and of
#           ReadDirectoryChangesW, and an imitation is where a lifetime
#           bug hides: a CancelIo that Wine completes at once says
#           nothing about a kernel that does not. This job runs those
#           four programs against the real API.
#
# The windows job is also the tree's first MSVC. Nothing here had an
# _MSC_VER guard before it, so the compiler is expected to find things
# the other two do not - which is what it is for. It builds the test
# programs directly rather than through the Makefile, because that file
# is POSIX make and this runner has none.
name: test

on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: what the Wine and libkqueue arms need
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine wine64 libkqueue-dev
      - run: make test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # No install step: clang and libdispatch are the system's. The
      # Wine and libkqueue arms are absent here and skip themselves.
      # The engine uses this system's own kqueue, which is what ships
      # here - and which is not the arm any claim about kqueue rests
      # on. The libkqueue run on the ubuntu job is that arm.
      - run: make test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      # The four programs whose arms only exist on this system: the
      # temp file, the signal wire, the directory watch and the IOCP
      # engine. Each is built from the sources the Makefile names for
      # it, and run at once - a program that builds and does not run
      # has proven the compiler and nothing else.
      - name: the temp file
        shell: cmd
        run: |
          cl /nologo /std:c11 /W3 /Isrc /Ishim\windows /Ishim\common ^
             /Fe:tmpfile.exe test\tmpfile.c src\slipstream_tmpfile.c || exit /b 1
          tmpfile.exe || exit /b 1
      - name: the signal wire
        shell: cmd
        run: |
          cl /nologo /std:c11 /W3 /Isrc /Ishim\windows /Ishim\common ^
             /Fe:signal.exe test\signal.c src\slipstream_signal.c ws2_32.lib || exit /b 1
          signal.exe || exit /b 1
      - name: the directory watch
        shell: cmd
        run: |
          cl /nologo /std:c11 /W3 /Isrc /Ishim\windows /Ishim\common ^
             /Fe:inotify.exe test\inotify.c src\slipstream_inotify.c || exit /b 1
          inotify.exe || exit /b 1
      - name: the IOCP engine
        shell: cmd
        run: |
          cl /nologo /std:c11 /W3 /Isrc /Ishim\windows /Ishim\common ^
             /Ideps\liburing\src\include /Fe:backends.exe test\backends.c ^
             src\slipstream_engine.c src\engine_dispatch.c src\engine_epoll.c ^
             src\engine_iocp.c src\engine_kqueue.c src\engine_posix.c ^
             src\engine_select.c ws2_32.lib || exit /b 1
          backends.exe || exit /b 1
